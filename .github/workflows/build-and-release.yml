name: 快速构建和发布
on:
  push:
    tags: ['v*']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Windows构建任务
  build-windows:
    name: Windows构建 (x64)
    runs-on: windows-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装Rust目标
      run: rustup target add x86_64-pc-windows-msvc

    - name: 更新node-gyp
      run: |
        npm install --global node-gyp@10.2.0
        npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}

    - name: 安装依赖并构建
      shell: powershell
      run: |
        npm i -g yarn node-gyp
        yarn --network-timeout 1000000
        yarn run build
        node scripts/prepackage-plugins.mjs
      env:
        ARCH: x64
        RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

    - name: 构建Windows应用
      run: node scripts/build-windows.mjs
      env:
        ARCH: x64

    - name: 整理构建产物
      run: |
        mkdir artifacts-setup
        mkdir artifacts-portable
        if (Test-Path "dist/*-setup-*.exe") { Move-Item "dist/*-setup-*.exe" "artifacts-setup/" }
        if (Test-Path "dist/*-portable-*.zip") { Move-Item "dist/*-portable-*.zip" "artifacts-portable/" }
      shell: powershell

    - name: 上传Windows安装包
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer-x64
        path: artifacts-setup/*
      if: always()

    - name: 上传Windows便携版
      uses: actions/upload-artifact@v4
      with:
        name: windows-portable-x64
        path: artifacts-portable/*
      if: always()

  # macOS构建任务
  build-macos:
    name: macOS构建 (arm64)
    runs-on: macos-15
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装Rust目标
      run: rustup target add aarch64-apple-darwin

    - name: 安装依赖
      run: |
        npm i -g yarn
        yarn --network-timeout 1000000
      env:
        ARCH: arm64

    - name: 构建前端
      run: yarn run build

    - name: 预打包插件
      run: node scripts/prepackage-plugins.mjs
      env:
        ARCH: arm64

    - name: 修复electron-builder问题
      run: |
        # 修复 ArchiveTarget.js 中的 updateInfo 问题
        sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js || true
        # 创建 electron 符号链接
        ln -s ../../node_modules/electron app/node_modules || true
        # 修复 DMG 构建权限问题
        sudo spctl --master-disable || true
        # 清理可能的缓存问题
        rm -rf ~/Library/Caches/electron-builder || true

    - name: 构建macOS应用
      run: node scripts/build-macos.mjs
      env:
        ARCH: arm64
        RUST_TARGET_TRIPLE: aarch64-apple-darwin
        USE_HARD_LINKS: false
        # 禁用代码签名（如果没有证书）
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: 整理构建产物
      run: |
        mkdir -p artifacts-dmg artifacts-zip
        echo "📁 检查 dist 目录内容:"
        ls -la dist/ || echo "dist 目录不存在"
        
        # 移动 dmg 文件
        if ls dist/*.dmg 1> /dev/null 2>&1; then
          echo "✅ 找到 DMG 文件"
          mv dist/*.dmg artifacts-dmg/
        else
          echo "❌ 未找到 DMG 文件"
        fi
        
        # 移动 zip 文件
        if ls dist/*.zip 1> /dev/null 2>&1; then
          echo "✅ 找到 ZIP 文件"
          mv dist/*.zip artifacts-zip/
        else
          echo "❌ 未找到 ZIP 文件"
        fi
        
        echo "📦 整理后的构建产物:"
        ls -la artifacts-dmg/ artifacts-zip/

    - name: 检查 DMG 文件
      id: check_dmg
      run: |
        if ls artifacts-dmg/*.dmg 1> /dev/null 2>&1; then
          echo "has_dmg=true" >> $GITHUB_OUTPUT
        else
          echo "has_dmg=false" >> $GITHUB_OUTPUT
        fi

    - name: 上传macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg-arm64
        path: artifacts-dmg/*
      if: steps.check_dmg.outputs.has_dmg == 'true'

    - name: 检查 ZIP 文件
      id: check_zip
      run: |
        if ls artifacts-zip/*.zip 1> /dev/null 2>&1; then
          echo "has_zip=true" >> $GITHUB_OUTPUT
        else
          echo "has_zip=false" >> $GITHUB_OUTPUT
        fi

    - name: 上传macOS ZIP
      uses: actions/upload-artifact@v4
      with:
        name: macos-zip-arm64
        path: artifacts-zip/*
      if: steps.check_zip.outputs.has_zip == 'true'

  # Linux ARM64构建任务（用于Android平板）
  build-linux-arm64:
    name: Linux ARM64构建 (Android平板)
    runs-on: ubuntu-24.04
    
    env:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      ARCH: arm64
      npm_config_arch: arm64
      npm_config_target_arch: arm64
      RUST_TARGET_TRIPLE: aarch64-unknown-linux-gnu
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装FPM
      run: sudo gem install fpm

    - name: 安装Rust目标
      run: rustup target add aarch64-unknown-linux-gnu

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libarchive-tools crossbuild-essential-arm64

    - name: 安装npm依赖
      run: |
        npm i -g yarn node-gyp
        yarn --network-timeout 1000000 --arch=arm64 --target-arch=arm64

    - name: 构建前端
      run: yarn run build --arch=arm64 --target-arch=arm64

    - name: 预打包插件
      run: node scripts/prepackage-plugins.mjs

    - name: 构建Linux包
      run: node scripts/build-linux.mjs
      env:
        USE_HARD_LINKS: false
        USE_SYSTEM_FPM: true

    - name: 打包Web资源
      run: |
        echo "📦 创建便携版本..."
        mkdir -p tabby-linux-arm64
        cp -r app/dist tabby-linux-arm64/
        cp -r builtin-plugins tabby-linux-arm64/
        
        # 创建启动脚本
        cat > tabby-linux-arm64/tabby.sh << 'EOF'
        #!/bin/bash
        # Tabby Terminal for Linux ARM64
        # 适用于Android平板的Termux环境
        
        SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
        cd "$SCRIPT_DIR"
        
        # 检查Node.js
        if ! command -v node &> /dev/null; then
            echo "错误: 未找到Node.js，请先安装Node.js"
            echo "在Termux中运行: pkg install nodejs"
            exit 1
        fi
        
        # 启动Tabby
        node dist/main.js "$@"
        EOF
        
        chmod +x tabby-linux-arm64/tabby.sh
        
        # 创建README
        cat > tabby-linux-arm64/README.md << 'EOF'
        # Tabby Terminal for Linux ARM64 (Android平板)
        
        ## 在Android平板上运行
        
        ### 使用Termux
        1. 安装Termux应用
        2. 在Termux中安装依赖：
           ```bash
           pkg update
           pkg install nodejs
           ```
        3. 解压此包并运行：
           ```bash
           ./tabby.sh
           ```
        
        ### 使用Linux容器
        1. 使用UserLAnd或类似应用
        2. 安装Ubuntu/Debian
        3. 运行此包
        
        ## 功能限制
        - 需要图形界面支持（VNC或X11）
        - 某些硬件加速功能可能不可用
        EOF
        
        tar -czf tabby-linux-arm64.tar.gz tabby-linux-arm64/
        echo "📦 打包大小: $(du -sh tabby-linux-arm64.tar.gz | cut -f1)"

    - name: 上传Linux ARM64包
      uses: actions/upload-artifact@v4
      with:
        name: Linux-ARM64-Android
        path: |
          dist/*.deb
          dist/*.AppImage
          tabby-linux-arm64.tar.gz
      if: always()

  # 发布任务
  release:
    name: 创建发布
    runs-on: ubuntu-24.04
    needs: [build-windows, build-macos, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 整理发布文件
      run: |
        mkdir -p release
        echo "📁 整理构建产物..."
        find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} release/ \;
        
        echo "📦 发布文件列表:"
        ls -la release/
        
        echo "📊 文件统计:"
        echo "Windows x64: $(find release -name "*.exe" -o -name "*windows*.zip" | wc -l) 个文件"
        echo "macOS arm64: $(find release -name "*.dmg" -o -name "*macos*.zip" | wc -l) 个文件"
        echo "Linux ARM64: $(find release -name "*.deb" -o -name "*.AppImage" -o -name "*arm64*.tar.gz" | wc -l) 个文件"

    - name: 获取发布信息
      id: release_info
      run: |
        echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "release_name=Tabby Terminal ${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        echo "is_prerelease=false" >> $GITHUB_OUTPUT

    - name: 生成更新日志
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # 🚀 Tabby Terminal 发布

        基于原版 [Tabby Terminal](https://github.com/Eugeny/tabby) 的定制版本。

        ## 📦 下载说明

        ### Windows 版本
        - **安装版**: `*-setup-*.exe` - 推荐用户使用，会自动安装到系统
        - **便携版**: `*-portable-*.zip` - 绿色版本，解压即用

        ### macOS 版本  
        - **DMG 安装包**: `*.dmg` - 拖拽到应用程序文件夹安装
        - **ZIP 压缩包**: `*.zip` - 直接解压使用
        
        ### Linux ARM64 版本（Android平板）
        - **DEB 包**: `*.deb` - 适用于Debian/Ubuntu系统
        - **AppImage**: `*.AppImage` - 通用Linux应用格式
        - **便携版**: `tabby-linux-arm64.tar.gz` - 适用于Termux等环境

        ## 🔧 架构支持

        - **Windows x64**: Intel/AMD 64位处理器
        - **macOS arm64**: Apple Silicon (M1/M2/M3/M4) 芯片
        - **Linux ARM64**: Android平板、树莓派等ARM64设备

        ## ⚙️ 主要功能

        - 🖥️ 多平台终端模拟器
        - 🔌 丰富的插件生态系统
        - 🎨 可定制的主题和外观
        - 🔐 SSH/Telnet/Serial 连接支持
        - 📂 文件传输和管理
        - 🛡️ 安全连接和密钥管理

        ## 🔗 相关链接

        - [原项目仓库](https://github.com/Eugeny/tabby)
        - [私有仓库](https://github.com/dbds-team/my_tabby)
        - [问题反馈](https://github.com/${{ github.repository }}/issues)

        ---

        **构建时间**: $(date '+%Y-%m-%d %H:%M:%S UTC')  
        **Git 提交**: \`${{ github.sha }}\`  
        **工作流程**: ${{ github.workflow }}
        EOF

    - name: 创建GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.release_name }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ steps.release_info.outputs.is_prerelease }}
        files: release/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 发布成功通知
      run: |
        echo "🎉 发布成功完成！"
        echo ""
        echo "📦 发布信息:"
        echo "  版本: ${{ steps.release_info.outputs.release_name }}"
        echo "  标签: ${{ steps.release_info.outputs.tag_name }}"
        echo "  预发布: ${{ steps.release_info.outputs.is_prerelease }}"
        echo ""
        echo "🔗 访问地址:"
        echo "  https://github.com/${{ github.repository }}/releases/tag/${{ steps.release_info.outputs.tag_name }}"
        echo ""
        echo "📋 发布内容统计:"
        echo "  Windows x64: $(find release -name "*.exe" -o -name "*windows*.zip" | wc -l) 个文件"
        echo "  macOS arm64: $(find release -name "*.dmg" -o -name "*macos*.zip" | wc -l) 个文件"
        echo "  Linux ARM64: $(find release -name "*.deb" -o -name "*.AppImage" -o -name "*arm64*.tar.gz" | wc -l) 个文件"