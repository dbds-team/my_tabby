name: 构建和发布 V2
on:
  push:
    tags: ['v*']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Windows构建任务
  build-windows:
    name: Windows构建
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]  # 只构建x64版本
      fail-fast: false
    
    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装Rust目标
      run: rustup target add ${{ env.RUST_TARGET_TRIPLE }}

    - name: 更新node-gyp
      run: |
        npm install --global node-gyp@10.2.0
        npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}

    - name: 安装依赖并构建
      shell: powershell
      run: |
        npm i -g yarn node-gyp
        yarn --network-timeout 1000000
        yarn run build
        node scripts/prepackage-plugins.mjs
      env:
        ARCH: ${{ matrix.arch }}

    - name: 构建Windows应用（无签名）
      run: node scripts/build-windows.mjs
      env:
        ARCH: ${{ matrix.arch }}

    - name: 整理构建产物
      shell: powershell
      run: |
        mkdir artifact-setup
        mkdir artifact-portable
        if (Test-Path "dist/*-setup-*.exe") { Move-Item "dist/*-setup-*.exe" "artifact-setup/" }
        if (Test-Path "dist/*-portable-*.zip") { Move-Item "dist/*-portable-*.zip" "artifact-portable/" }

    - name: 上传Windows安装包
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer-${{ matrix.arch }}
        path: artifact-setup/*

    - name: 上传Windows便携版
      uses: actions/upload-artifact@v4
      with:
        name: windows-portable-${{ matrix.arch }}
        path: artifact-portable/*

  # macOS构建任务
  build-macos:
    name: macOS构建
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64]  # 只构建arm64版本
      fail-fast: false

    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET_TRIPLE: aarch64-apple-darwin

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装Rust目标
      run: rustup target add ${{ env.RUST_TARGET_TRIPLE }}

    - name: 安装依赖
      run: |
        npm i -g yarn
        yarn --network-timeout 1000000
      env:
        ARCH: ${{ matrix.arch }}

    - name: 构建前端
      run: yarn run build

    - name: 预打包插件
      run: node scripts/prepackage-plugins.mjs
      env:
        ARCH: ${{ matrix.arch }}

    - name: 修复electron-builder问题
      run: |
        sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js || true
        ln -s ../../node_modules/electron app/node_modules || true

    - name: 构建macOS应用（无签名）
      run: node scripts/build-macos.mjs
      env:
        ARCH: ${{ matrix.arch }}
        USE_HARD_LINKS: false
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: 整理构建产物
      run: |
        mkdir -p artifact-dmg artifact-zip
        [ -f dist/*.dmg ] && mv dist/*.dmg artifact-dmg/ || echo "No DMG found"
        [ -f dist/*.zip ] && mv dist/*.zip artifact-zip/ || echo "No ZIP found"

    - name: 上传macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg-${{ matrix.arch }}
        path: artifact-dmg/*
      if: always()

    - name: 上传macOS ZIP
      uses: actions/upload-artifact@v4
      with:
        name: macos-zip-${{ matrix.arch }}
        path: artifact-zip/*
      if: always()

  # Web/Android构建任务
  build-web:
    name: Web/Android构建
    runs-on: ubuntu-24.04
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev

    - name: 安装项目依赖
      run: |
        npm i -g yarn
        cd app && yarn --network-timeout 1000000
        cd .. && rm -f app/node_modules/.yarn-integrity
        yarn --network-timeout 1000000

    - name: 构建Web版本
      run: |
        yarn run build
        node scripts/prepackage-plugins.mjs

    - name: 打包Web资源
      run: |
        tar czf tabby-web.tar.gz app/dist
        echo "Web包大小: $(du -sh tabby-web.tar.gz | cut -f1)"

    - name: 创建Android项目模板
      run: |
        node scripts/build-android-hybrid.mjs || echo "Android构建脚本执行完成"
        
    - name: 打包Android项目
      run: |
        if [ -d "android-hybrid" ]; then
          tar czf android-hybrid-template.tar.gz android-hybrid/
          echo "Android包大小: $(du -sh android-hybrid-template.tar.gz | cut -f1)"
        else
          echo "Android项目未创建"
          echo "请检查构建日志" > android-error.txt
          tar czf android-hybrid-template.tar.gz android-error.txt
        fi

    - name: 上传Web包
      uses: actions/upload-artifact@v4
      with:
        name: web-tarball
        path: tabby-web.tar.gz

    - name: 上传Android模板
      uses: actions/upload-artifact@v4
      with:
        name: android-template
        path: android-hybrid-template.tar.gz

  # 发布任务
  release:
    name: 创建发布
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 整理发布文件
      run: |
        mkdir -p release
        find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
        ls -la release/
        echo "文件统计:"
        echo "- Windows: $(find release -name "*windows*.exe" -o -name "*windows*.zip" | wc -l) 个"
        echo "- macOS: $(find release -name "*.dmg" -o -name "*macos*.zip" | wc -l) 个"
        echo "- Web/Android: $(find release -name "*.tar.gz" | wc -l) 个"

    - name: 创建发布
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        body: |
          # 🚀 Tabby Terminal 发布
          
          ## 📦 下载说明
          
          ### Windows
          - 安装版: `*-setup-*.exe`
          - 便携版: `*-portable-*.zip`
          
          ### macOS  
          - DMG: `*.dmg`
          - ZIP: `*.zip`
          
          ### Web/Android
          - Web资源: `tabby-web.tar.gz`
          - Android模板: `android-hybrid-template.tar.gz`
          
          ---
          基于 [Tabby Terminal](https://github.com/Eugeny/tabby)